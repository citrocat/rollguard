<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RollGuard</title>
  <link rel="stylesheet" href="../shared/riot.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="popup">
  <header class="rg-topbar rg-topbar--compact">
    <span class="rg-brand">
      <span class="rg-brandmark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m6 6 12 12"/></svg>
      </span>
      <span class="rg-wordmark">ROLL<span>GUARD</span><i>!</i></span>
    </span>
    <button class="rg-onair" id="powerToggle" type="button" aria-pressed="true" title="点击暂停或恢复防护">
      <span id="powerLabel">ON AIR</span>
    </button>
  </header>

  <div class="rg-ticker" aria-hidden="true">
    <div class="rg-ticker-track"><span>NO MORE RICKROLLS</span><b>✦</b><span>NEVER GONNA LET YOU DOWN</span><b>✦</b><span>LOCAL ONLY</span><b>✦</b></div>
  </div>

  <main class="popup-body">
    <section class="rg-card hero" id="hero">
      <div class="hero-copy">
        <span class="rg-label">TODAY'S CATCH</span>
        <div class="hero-num"><span id="todayCount">00</span><em>次</em></div>
        <span class="rg-chip rg-chip--ink" id="heroCaption">成功拦截 Rickroll</span>
        <span class="rg-meta">↓ 还你清净互联网</span>
      </div>
      <div class="poster" aria-hidden="true">
        <div class="poster-top">NEVER<br>GONNA</div>
        <div class="rg-vinyl"><img src="../assets/official-4k.jpg" alt=""></div>
        <span class="rg-sticker">已拦截</span>
        <div class="poster-bottom">GIVE YOU UP</div>
      </div>
    </section>

    <button class="rg-btn rg-btn--pink rg-btn--lg cta" id="scanButton" type="button">
      <span>
        <b id="scanLabel">一键全量拦截</b>
        <small id="scanSub">防护已开启 · 扫描本页链接</small>
      </span>
      <span class="rg-btn-icon" aria-hidden="true">
        <svg class="rg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m6 6 12 12"/></svg>
      </span>
    </button>

    <section class="section">
      <div class="rg-head">
        <h3>本周通缉</h3>
        <span class="rg-label">MOST WANTED · 03</span>
      </div>
      <div class="wanted" id="wantedCards"></div>
    </section>

    <section class="section">
      <div class="rg-head">
        <h3>刚刚抓到</h3>
        <button class="rg-linkbtn" id="openHistory" type="button">全部记录 ↗</button>
      </div>
      <div id="latestBox"></div>
    </section>
  </main>

  <footer class="rg-footer">
    <span class="rg-dot">本地留痕 · 短链自动展开</span>
    <span>STAY SAFE, KID <b id="totalCount">0</b></span>
  </footer>

  <div class="rg-toast" id="toast" role="status" aria-live="polite">
    <span class="rg-toast-mark" aria-hidden="true">R!</span>
    <span id="toastText">已更新</span>
  </div>

  <script src="../shared/config.js"></script>
  <script src="../shared/detection.js"></script>
  <script src="../shared/riot.js"></script>
  <script src="popup.js"></script>
</body>
</html>
